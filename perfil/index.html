<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed | SocialCar</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="popup_style.css">
</head>
<body>
    <header class="cabecario">
        <div class="logo">
            <img class="logoHeader" src="logo.png" alt="logo">
            <h2 class="h2Cabecario">SocialCar</h2>
        </div>
        <div class="botoesCabecario">
            <a href="../Feed/index.html"> <h2 class="botoesHeader"><b>Feed</b></h2></a>
            <a href="index.html"> <h2 class="botoesHeader">Perfil</h2></a>
            <a href="../quizz/index.html"> <h2 class="botoesHeader">Quizz</h2></a>
            <a href="../sobre/index.html"> <h2 class="botoesHeader">Sobre</h2></a>
            <a href="../login/index.html"> <h2 class="botoesHeader">Sair</h2></a>

        </div>
    </header>
    <div class="container_popup" onclick="fecharAba('.container_popup')">

        <div class="caixa_popUp" onclick="event.stopPropagation()">
            <div class="popUp">
                <div class="container_perfil">
                    <div class="perfil_usuario"></div>
                    <h3 class="nome_usuario">Eliezer Martinhago da Silva</h3>
                </div>
                <textarea class="txtArea" name="textBox" id="textBox" ></textarea>
                <div class="caixaBtn">
                    <div class="caixaBtnImg">
                        <label class="labelBtnImg" onclick="adicionarImg()">
                            <input class="inputImg" type="file" accept="image/*" />
                            <span class="exibirImg"></span>
                        </label>
                    </div>

                    <div class="caixaBtnEnviar">
                        <button class="botaoEnviar" onclick="enviarPublicacao()">Enviar</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <main class="corpo">
        <div class="containerPopUp">
            <div class="popUpPerfil">
                <h2 class="h2PopUpPerfil">Você deseja usar essa imagem de perfil?</h2>
                <button class="btnPopUpPerfil" id="botaoSim">Sim</button>
                <button class="btnPopUpPerfil" id="botaoNao">Não</button>
            </div>
        </div>    
        <div class="perfil_container">
            <div class="caixaPerfil">
                <div class="perfil">
                    <div class="imgPerfil">
                        <label class="trocarFoto" onclick="adicionarImgPerfil()">
                            <svg class="icone" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512"><!--!Font Awesome Free 6.7.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2024 Fonticons, Inc.--><path fill="#ffffff" d="M213.1 64.8L202.7 96 128 96c-35.3 0-64 28.7-64 64l0 256c0 35.3 28.7 64 64 64l384 0c35.3 0 64-28.7 64-64l0-256c0-35.3-28.7-64-64-64l-74.7 0L426.9 64.8C420.4 45.2 402.1 32 381.4 32L258.6 32c-20.7 0-39 13.2-45.5 32.8zM448 256c0 8.8-7.2 16-16 16l-76.7 0c-6.2 0-11.3-5.1-11.3-11.3c0-3 1.2-5.9 3.3-8L371 229c-13.6-13.4-31.9-21-51-21c-19.2 0-37.7 7.6-51.3 21.3L249 249c-9.4 9.4-24.6 9.4-33.9 0s-9.4-24.6 0-33.9l19.7-19.7C257.4 172.7 288 160 320 160c31.8 0 62.4 12.6 85 35l23.7-23.7c2.1-2.1 5-3.3 8-3.3c6.2 0 11.3 5.1 11.3 11.3l0 76.7zM192 320c0-8.8 7.2-16 16-16l76.7 0c6.2 0 11.3 5.1 11.3 11.3c0 3-1.2 5.9-3.3 8L269 347c13.6 13.4 31.9 21 51 21c19.2 0 37.7-7.6 51.3-21.3L391 327c9.4-9.4 24.6-9.4 33.9 0s9.4 24.6 0 33.9l-19.7 19.7C382.6 403.3 352 416 320 416c-31.8 0-62.4-12.6-85-35l-23.7 23.7c-2.1 2.1-5 3.3-8 3.3c-6.2 0-11.3-5.1-11.3-11.3l0-76.7z"/></svg>                            <input class="inputImgPerfil" type="file" accept="image/*" />
                            <span class="exibirImgPerfil"></span>
                        </label>
                    </div>
                    <div class="nomePerfil">Eliezer Martinhago da silva</div>
                </div>    
                <p class="pPerfil">Compartilhe suas ideias!</p>

                <div class="caixaBtnPerfil">
                    <button onclick="abrirAbaPublicacao()" class="btnPublicar">Criar publicação</button>
                </div>
            </div>
        </div>
        <div class="publicacoes">
            <div class="publicacao">
                <div class="containerUsuario">
                    <div class="imgUsuario"></div>
                    <div class="nomeUsuario">Eliezer Martinhago da silva</div>
                </div>
                <div class="legendaPublicacao">Hoje eu vi um fusca vermelho...</div>
                <div class="imgPublicacao"></div>
            </div>

        </div>
    </main>
    <script src="index.js"></script>
</body>
</html>
