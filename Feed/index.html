<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed | SocialCar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="popup_style.css">
    <link rel="stylesheet" href="popup_sair.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <header class="cabecario">
        <div class="logo">
            <img class="logoHeader" src="logo.png" alt="logo">
            <h2 class="h2Cabecario">SocialCar</h2>
        </div>
        <div class="botoesCabecario">
            <a href="../Feed/index.html"> <h2 class="botoesHeader"><b>Feed</b></h2></a>
            <a href="../perfil/index.html"> <h2 class="botoesHeader" id="btnPerfil">Perfil</h2></a>
            <a href="../quizz/index.html"> <h2 class="botoesHeader">Quizz</h2></a>
            <a href="../sobre/index.html"> <h2 class="botoesHeader">Sobre</h2></a>
            <a href="../login/index.html"> <h2 class="botoesHeader" id="login">Login</h2></a>
            <div>
                <h2 class="botoesHeader" id="btnSair" onclick="abrirAbaSair('.containerPopUpSair')">Sair</h2>
                    <div class="containerPopUpSair">
                        <div class="popUpPerfil">
                            <h2 class="h2PopUpPerfil">Você deseja encerrar a sessão?</h2>
                            <button class="btnPopUpPerfil" id="btnSimSair" onclick="encerrarSessao()">Sim</button>
                            <button class="btnPopUpPerfil" id="btnNaoSair" onclick="encerrarSessao()">Não</button>
                        </div>
                    </div>
            </div>
        </div>
    </header>
    <div class="container_popup" onclick="fecharAba()">

        <div class="caixa_popUp" onclick="event.stopPropagation()">
            <div class="popUp">
                <div class="container_perfil">
                    <div class="perfil_usuario"></div>
                    <h3 class="nome_usuario"></h3>
                </div>
                <textarea class="txtArea" name="textBox" id="textBox" placeholder="Legenda da sua Publicação!"></textarea>
                <div class="caixaBtn">
                    <div class="caixaBtnImg">
                        <label class="labelBtnImg" onclick="adicionarImg()">
                            <input class="inputImg" type="file" accept="image/*" />
                            <span class="exibirImg"></span>
                        </label>
                    </div>

                    <div class="caixaBtnEnviar">
                        <button class="botaoEnviar" onclick="enviarPublicacao()">Enviar</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <main class="corpo">


        <div class="publicacoes">
            

        </div>
        <div class="perfil_container">
            <div class="caixaPerfil" >
                <div class="perfil" >
                    <div class="imgPerfil"></div>
                    <div class="nomePerfil"></div>
                </div>    
                <p class="pPerfil">Compartilhe suas ideias!</p>

                <div class="caixaBtnPerfil">
                    <button onclick="abrirAba()" class="btnPublicar">Criar publicação</button>
                </div>


                <div class="caixaQuizz">
                    <h3 class="h3Quizz">Quizz Salvos</h3>
                    <div class="quizzSalvos">Qual carro combina mais com você!</div>
                    <div class="quizzSalvos"> Qual estilo de carro você mais gosta!</div>
                </div>
            </div>
        </div>
    </main>
    <script src="index.js"></script>
</body>
</html>
