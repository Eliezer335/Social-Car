<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed | SocialCar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="popup_style.css">
</head>
<body>
    <header class="cabecario">
        <div class="logo">
            <img class="logoHeader" src="logo.png" alt="logo">
            <h2 class="h2Cabecario">SocialCar</h2>
        </div>
        <div class="botoesCabecario">
            <a href="../Feed/index.html"> <h2 class="botoesHeader"><b>Feed</b></h2></a>
            <a href=""> <h2 class="botoesHeader">Perfil</h2></a>
            <a href="../quizz/index.html"> <h2 class="botoesHeader">Quizz</h2></a>
            <a href="../sobre/index.html"> <h2 class="botoesHeader">Sobre</h2></a>
        </div>
    </header>
    <div class="container_popup" onclick="fecharAba()">

        <div class="caixa_popUp" onclick="event.stopPropagation()">
            <div class="popUp">
                <div class="container_perfil">
                    <div class="perfil_usuario"></div>
                    <h3 class="nome_usuario">Eliezer Martinhago da Silva</h3>
                </div>
                <textarea class="txtArea" name="textBox" id="textBox" ></textarea>
                <div class="caixaBtn">
                    <div class="caixaBtnImg">
                        <svg class="btnImg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><!--!Font Awesome Free 6.6.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2024 Fonticons, Inc.--><path fill="#000000" d="M448 80c8.8 0 16 7.2 16 16l0 319.8-5-6.5-136-176c-4.5-5.9-11.6-9.3-19-9.3s-14.4 3.4-19 9.3L202 340.7l-30.5-42.7C167 291.7 159.8 288 152 288s-15 3.7-19.5 10.1l-80 112L48 416.3l0-.3L48 96c0-8.8 7.2-16 16-16l384 0zM64 32C28.7 32 0 60.7 0 96L0 416c0 35.3 28.7 64 64 64l384 0c35.3 0 64-28.7 64-64l0-320c0-35.3-28.7-64-64-64L64 32zm80 192a48 48 0 1 0 0-96 48 48 0 1 0 0 96z"/></svg>
                    </div>
                    <div class="caixaBtnEnviar">
                        <button class="botaoEnviar">Enviar</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <main class="corpo">


        <div class="publicacoes">
            <div class="publicacao">
                <div class="containerUsuario">
                    <div class="imgUsuario"></div>
                    <div class="nomeUsuario">Eliezer Martinhago da silva</div>
                </div>
                <div class="legendaPublicacao">Hoje eu vi um fusca vermelho...</div>
                <div class="imgPublicacao"></div>
            </div>

        </div>
        <div class="perfil_container">
            <div class="caixaPerfil">
                <div class="perfil">
                    <div class="imgPerfil"></div>
                    <div class="nomePerfil">Eliezer Martinhago da silva</div>
                </div>    
                <p class="pPerfil">Compartilhe suas ideias!</p>

                <div class="caixaBtnPerfil">
                    <button onclick="abrirAba()" class="btnPublicar">Criar publicação</button>
                </div>


                <div class="caixaQuizz">
                    <h3 class="h3Quizz">Quizz Salvos</h3>
                    <div class="quizzSalvos">Qual carro combina mais com você!</div>
                    <div class="quizzSalvos"> Qual estilo de carro você mais gosta!</div>
                </div>
            </div>
        </div>
    </main>
    <script src="index.js"></script>
</body>
</html>
